name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Without this the verify job below only ran after merge, so nothing gated a
  # pull request. The deploy job stays main-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the engine and its tools are plain ESM.
      - name: Engine tests
        run: node tests/run.js
      - name: Balance simulator
        run: node tools/balance-sim.js --check --seeds 5

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The repository root is the site: there is nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
